name: CI

on:
  pull_request:            # validate all PRs
    branches: ["**"]
  push:                    # only after merge or when tagging
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUST_LOG: error,urlsup=debug

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for codecov

      - name: Setup Rust with caching and tools
        uses: brndnmtthws/rust-action@v1  # Comes with cargo-tarpaulin pre-built
        with:
          # Pinned by rust-toolchain.toml; keep in sync when bumping.
          toolchain: stable
          enable-sccache: true

      - name: Verify lockfile is up to date
        run: cargo check --locked --all-targets

      - name: Lint (format check)
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Generate test coverage
        run: cargo tarpaulin --all-features --workspace --timeout 120 --out xml

      - name: Upload test coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: simeg/urlsup
          fail_ci_if_error: false

  # The release profile (lto = "fat", panic = "abort", codegen-units = 1) is not
  # exercised by `cargo test`, so LTO/abort failures would only surface at
  # publish time. This also validates that the crate packages with its LICENSE.
  release-build:
    name: Release build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: brndnmtthws/rust-action@v1
        with:
          toolchain: stable
          enable-sccache: true

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify the binary runs
        run: ./target/release/urlsup --version

      - name: Verify crate packages cleanly
        run: cargo package --locked --list | grep -qx LICENSE

  # urlsup is a CLI with per-platform shell-completion paths, so a Linux-only
  # matrix left the macOS and Windows code paths never compiled or run.
  cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: brndnmtthws/rust-action@v1
        with:
          toolchain: stable
          enable-sccache: true

      - name: Test
        run: cargo test --all-features --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # rust-toolchain.toml pins the dev toolchain, so override it here to
      # verify the declared MSRV actually builds.
      - name: Install MSRV toolchain
        run: |
          rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
          rustup override set ${{ steps.msrv.outputs.version }}

      - name: Check against MSRV
        run: cargo check --all-targets --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-audit's own dependencies can require a newer rustc than the
      # toolchain this project pins, so install it on stable rather than
      # letting rust-toolchain.toml apply here.
      - name: Install stable toolchain for cargo-audit
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit --deny warnings
